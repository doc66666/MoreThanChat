name: Build manual Windows distributions

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-distribution:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1
        with:
          version: 11.21.0
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.12.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm package:windows
      - name: Save installer, ZIP and hashes (no release publishing)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: MoreThanChat-windows-manual-distribution
          path: |
            .artifacts/windows-distributions/*/*-setup.exe
            .artifacts/windows-distributions/*/*.zip
            .artifacts/windows-distributions/*/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
